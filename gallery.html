    <script>
        const lightbox = GLightbox({ touchNavigation: true, loop: true });
        
        // Filter Gallery - משופר!
        function filterGallery(cat) {
            document.querySelectorAll('.category-section').forEach(sec => {
                sec.style.display = (cat === 'all' || sec.dataset.category === cat) ? 'block' : 'none';
            });
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(cat)) {
                    btn.classList.add('active');
                }
            });
            
            // Save to localStorage
            localStorage.setItem('galleryCategory', cat);
            
            // Update URL hash
            window.location.hash = cat === 'all' ? '' : cat;
        }
        
        // Load from localStorage or URL hash on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlHash = window.location.hash.substring(1); // Remove #
            const savedCategory = localStorage.getItem('galleryCategory');
            const category = urlHash || savedCategory || 'all';
            
            if (category && category !== 'all') {
                filterGallery(category);
            }
        });
        
        // Mobile Menu Toggle - משופר!
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            const menuIcon = document.querySelector('.menu-toggle i');
            
            navLinks.classList.toggle('active');
            
            // שינוי אייקון
            if (navLinks.classList.contains('active')) {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-times');
            } else {
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            }
        }
        
        // סגירה אוטומטית של תפריט
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                const navLinks = document.getElementById('navLinks');
                const menuIcon = document.querySelector('.menu-toggle i');
                
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                    menuIcon.classList.remove('fa-times');
                    menuIcon.classList.add('fa-bars');
                }
            });
        });
    </script>
